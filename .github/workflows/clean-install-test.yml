name: Clean Install Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/clean-install-test.yml"
      - "backend/**"
      - "frontend/**"
      - ".env.example"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-clean-install:
    name: Backend clean install on Windows
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: sqlite:///./database/medical_ai.db
      SQLITE_FALLBACK: "true"

    steps:
      - name: Checkout fresh repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Verify Python
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      - name: Create clean backend environment
        shell: pwsh
        run: |
          if (Test-Path "backend\.venv") { Remove-Item -Recurse -Force "backend\.venv" }
          if (Test-Path "backend\database\medical_ai.db") { Remove-Item -Force "backend\database\medical_ai.db" }
          Copy-Item ".env.example" "backend\.env" -Force
          python -m venv backend\.venv

      - name: Install backend dependencies from scratch
        shell: pwsh
        run: |
          & "backend\.venv\Scripts\python.exe" -m pip install --upgrade pip
          & "backend\.venv\Scripts\python.exe" -m pip install -r backend\requirements.txt

      - name: Initialize clean database
        shell: pwsh
        working-directory: backend
        run: |
          & ".\.venv\Scripts\python.exe" -c "from pathlib import Path; from app.database.base import Base; from app.database.connection import engine, SessionLocal; import app.models.user, app.models.device, app.models.fault_report, app.models.maintenance, app.models.fault_reference_rule, app.models.audit_log, app.models.analysis_event; from app.database.seed import seed_database; from app.services.fault_reference_lookup_service import FaultReferenceLookupService; Base.metadata.create_all(bind=engine); seed_database(); db=SessionLocal(); p=Path('reference_data/medical_device_fault_reference.json'); n=FaultReferenceLookupService(db).load_rules_from_json(str(p)); print('reference_rules_imported=' + str(n)); db.close()"

      - name: Verify clean database contents
        shell: pwsh
        working-directory: backend
        run: |
          & ".\.venv\Scripts\python.exe" -c "from app.database.connection import SessionLocal; from app.models.user import User; from app.models.device import Device; from app.models.fault_reference_rule import FaultReferenceRule; import app.models.maintenance, app.models.fault_report; db=SessionLocal(); u=db.query(User).count(); d=db.query(Device).count(); r=db.query(FaultReferenceRule).count(); print(f'users={u}, devices={d}, reference_rules={r}'); db.close(); assert u >= 5; assert d >= 3; assert r == 39"

      - name: Start backend
        id: backend_start
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "$PWD\backend\.venv\Scripts\python.exe" `
            -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8000" `
            -WorkingDirectory "$PWD\backend" `
            -RedirectStandardOutput "$PWD\backend-stdout.log" `
            -RedirectStandardError "$PWD\backend-stderr.log" `
            -PassThru

          "pid=$($process.Id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $healthy = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 3
              if ($response.status -eq "healthy") {
                $healthy = $true
                break
              }
            } catch {}
          }

          if (-not $healthy) {
            Write-Host "Backend failed to become healthy."
            if (Test-Path "$PWD\backend-stdout.log") { Get-Content "$PWD\backend-stdout.log" }
            if (Test-Path "$PWD\backend-stderr.log") { Get-Content "$PWD\backend-stderr.log" }
            exit 1
          }

          Write-Host "Backend started successfully."

      - name: Verify API health and documentation
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health"
          if ($health.status -ne "healthy") {
            throw "Health endpoint did not return healthy."
          }

          $docs = Invoke-WebRequest -Uri "http://127.0.0.1:8000/docs" -UseBasicParsing
          if ($docs.StatusCode -ne 200) {
            throw "Swagger docs endpoint failed."
          }

          Write-Host "API health and documentation passed."

      - name: Verify demo authentication
        shell: pwsh
        run: |
          $login = Invoke-RestMethod `
            -Method Post `
            -Uri "http://127.0.0.1:8000/api/auth/login" `
            -ContentType "application/x-www-form-urlencoded" `
            -Body @{ username = "admin"; password = "admin123" }

          if (-not $login.access_token) {
            throw "Demo admin login did not return an access token."
          }

          if ($login.user.username -ne "admin") {
            throw "Unexpected demo user returned by login."
          }

          Write-Host "Demo authentication passed."

      - name: Stop backend before automated tests
        if: always() && steps.backend_start.outputs.pid != ''
        shell: pwsh
        run: |
          Stop-Process -Id "${{ steps.backend_start.outputs.pid }}" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Run backend automated tests
        shell: pwsh
        working-directory: backend
        run: |
          & ".\.venv\Scripts\python.exe" -m pytest -q

      - name: Show backend logs on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "$PWD\backend-stdout.log") {
            Write-Host "=== backend stdout ==="
            Get-Content "$PWD\backend-stdout.log"
          }
          if (Test-Path "$PWD\backend-stderr.log") {
            Write-Host "=== backend stderr ==="
            Get-Content "$PWD\backend-stderr.log"
          }

  frontend-clean-install:
    name: Frontend clean install on Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout fresh repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node.js
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies from lockfile
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: |
          npm run build

      - name: Run frontend tests
        shell: pwsh
        working-directory: frontend
        run: |
          npm test -- --run --passWithNoTests

      - name: Start built frontend preview
        id: frontend_start
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "npm.cmd" `
            -ArgumentList "run","preview","--","--host","127.0.0.1","--port","4173" `
            -WorkingDirectory "$PWD\frontend" `
            -RedirectStandardOutput "$PWD\frontend-stdout.log" `
            -RedirectStandardError "$PWD\frontend-stderr.log" `
            -PassThru

          "pid=$($process.Id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 1
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:4173" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            } catch {}
          }

          if (-not $ready) {
            Write-Host "Frontend preview failed to start."
            if (Test-Path "$PWD\frontend-stdout.log") { Get-Content "$PWD\frontend-stdout.log" }
            if (Test-Path "$PWD\frontend-stderr.log") { Get-Content "$PWD\frontend-stderr.log" }
            exit 1
          }

          Write-Host "Frontend preview passed."

      - name: Stop frontend preview
        if: always() && steps.frontend_start.outputs.pid != ''
        shell: pwsh
        run: |
          Stop-Process -Id "${{ steps.frontend_start.outputs.pid }}" -Force -ErrorAction SilentlyContinue

      - name: Show frontend logs on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path "$PWD\frontend-stdout.log") {
            Write-Host "=== frontend stdout ==="
            Get-Content "$PWD\frontend-stdout.log"
          }
          if (Test-Path "$PWD\frontend-stderr.log") {
            Write-Host "=== frontend stderr ==="
            Get-Content "$PWD\frontend-stderr.log"
          }
