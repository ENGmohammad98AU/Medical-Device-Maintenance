name: Compare grounded answer latency
on:
  pull_request:
    branches: [perf/static-prefix-state]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  same-machine-comparison:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MDM_PREFIX_ASSET_DIR: ${{ github.workspace }}/frontend/benchmark-results/prefix-cache
      MDM_REQUIRE_PREFIX_ASSETS: '1'
      LLM_MODEL_FILE: ${{ github.workspace }}/.cache/models/Qwen3-1.7B-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/prefix-assets
        with:
          token: ${{ github.token }}
      - name: Download one verified model for both measurements
        run: node tools/guidance-latency/download-model.mjs
      - name: Build and test the candidate
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build -- --mode benchmark
          npx playwright install chromium
      - name: Build the fixed baseline
        shell: bash
        run: |
          git worktree add --detach .latency-baseline 55b426fc5238130a56c70644b1794397500660d5
          cd .latency-baseline/frontend
          npm ci
          npm run build -- --mode benchmark
      - name: Record baseline answers including their existing timeouts
        id: baseline
        continue-on-error: true
        working-directory: .latency-baseline/frontend
        run: npm run benchmark:prepared -- --generation
      - name: Require all six candidate answers to complete
        id: candidate
        working-directory: frontend
        run: npm run benchmark:prepared -- --generation
      - name: Compare identical reports on the same runner
        run: node tools/guidance-latency/compare.mjs
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate generated answers and guards through the real API
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./database/medical_ai.db
          SQLITE_FALLBACK: 'true'
          MDM_GENERATION_BENCHMARK: ../frontend/benchmark-results/prepared-generation.json
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q test_generated_guidance.py test_customer_support.py test_generation_benchmark.py
      - name: Save both successes and failures without model binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounded-answer-comparison
          include-hidden-files: true
          path: |
            frontend/benchmark-results/prepared-generation.json
            frontend/benchmark-results/prepared-generation.png
            frontend/benchmark-results/guidance-comparison.json
            .latency-baseline/frontend/benchmark-results/prepared-generation.json
            .latency-baseline/frontend/benchmark-results/prepared-generation.png
          if-no-files-found: warn
