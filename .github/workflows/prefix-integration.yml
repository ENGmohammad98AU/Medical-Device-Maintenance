name: Production prefix cache and repeat analysis
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'tools/prefix-cache/integration.mjs'
      - 'tools/prefix-cache/benchmark-baseline.json'
      - '.github/workflows/prefix-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  production-worker:
    name: Production worker on Windows (${{ matrix.threads }} threads)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        threads: [4, 1]
    env:
      MDM_PREFIX_ASSET_DIR: ${{ github.workspace }}/frontend/benchmark-results/prefix-cache
      MDM_REQUIRE_PREFIX_ASSETS: '1'
      BENCHMARK_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/prefix-assets
        with:
          token: ${{ github.token }}
      - name: Build the application with verified production assets
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --mode benchmark
          npm test -- --run
          npx playwright install chromium
      - name: Check persistent startup and real inference
        run: node tools/prefix-cache/integration.mjs
      - name: Save production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-prefix-${{ matrix.threads }}-threads
          path: |
            frontend/benchmark-results/prefix-integration-*.json
            frontend/benchmark-results/prefix-integration-*.png
          if-no-files-found: warn
