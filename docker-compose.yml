services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medical_ai_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medical_ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/medical_ai_platform
      SQLITE_FALLBACK: "false"
      SEED_DEMO_DATA: "true"
      SECRET_KEY: local-development-secret-change-me
      DEBUG: "true"
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
      AI_MODE: ${AI_MODE:-reference}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini-2025-04-14}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      MAX_TOKENS: ${MAX_TOKENS:-1000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
